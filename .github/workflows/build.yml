name: Build NovaQuest 3D APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4

      - name: Synthesize Copyright-Clean 3D Graphics & Spatial Audio
        run: |
          mkdir -p assets
          python3 -c "
          import wave, struct, math, zlib

          # 1. Pure Python High-Resolution Vector-Style PNG Synthesizer
          def generate_badge(filename, r_bg, g_bg, b_bg, emblem):
              w, h = 320, 240
              raw = bytearray()
              for y in range(h):
                  raw.append(0)  # PNG Filter type None
                  for x in range(w):
                      dx = x - 160
                      dy = y - 120
                      dist = math.sqrt(dx*dx + dy*dy)
                      r, g, b = r_bg, g_bg, b_bg
                      
                      # Hologram outer glow rim
                      if 75 < dist < 82:
                          r, g, b = 0, 229, 255
                      
                      # Emblem generation
                      if emblem == 'star' and (dist < 55 or (abs(dx) + abs(dy) < 70)):
                          r, g, b = 255, 215, 0
                      elif emblem == 'money' and (dist < 50 or (abs(x-160) < 18 and abs(y-120) < 30)):
                          r, g, b = 255, 190, 20
                      elif emblem == 'planet' and (dist < 48 or abs(dist - 65) < 5):
                          r, g, b = 80, 190, 255
                      elif emblem == 'plant' and 150 < x < 170 and 80 < y < 170:
                          r, g, b = 60, 220, 90

                      raw.extend([int(r), int(g), int(b)])

              ihdr = struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)
              idat = zlib.compress(bytes(raw), 9)
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)

              with open(filename, 'wb') as f:
                  f.write(b'\x89PNG\r\n\x1a\n')
                  f.write(chunk(b'IHDR', ihdr))
                  f.write(chunk(b'IDAT', idat))
                  f.write(chunk(b'IEND', b''))

          # Generate Brand Icon (512x512)
          def generate_icon():
              w, h = 512, 512
              raw = bytearray()
              for y in range(h):
                  raw.append(0)
                  for x in range(w):
                      dx, dy = x - 256, y - 240
                      dist = math.sqrt(dx*dx + dy*dy)
                      r = int(10 + (y / 512) * 15)
                      g = int(20 + (y / 512) * 25)
                      b = int(45 + (y / 512) * 45)
                      
                      orbit_a = abs(math.sqrt((dx * 0.86 - dy * 0.5)**2 + (dy * 2.2)**2) - 130)
                      orbit_b = abs(math.sqrt((dx * 0.86 + dy * 0.5)**2 + (dy * 2.2)**2) - 130)
                      if orbit_a < 7 or orbit_b < 7:
                          r, g, b = 0, 229, 255
                      if dist < 65 or (abs(dx) + abs(dy) < 95):
                          r, g, b = 255, 214, 0
                      if dist < 22:
                          r, g, b = 255, 255, 255
                      raw.extend([r, g, b])

              ihdr = struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)
              idat = zlib.compress(bytes(raw), 9)
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)

              with open('assets/icon.png', 'wb') as f:
                  f.write(b'\x89PNG\r\n\x1a\n')
                  f.write(chunk(b'IHDR', ihdr))
                  f.write(chunk(b'IDAT', idat))
                  f.write(chunk(b'IEND', b''))

          generate_icon()
          generate_badge('assets/money.png', 18, 45, 30, 'money')
          generate_badge('assets/planets.png', 10, 20, 45, 'planet')
          generate_badge('assets/sun.png', 30, 25, 45, 'star')
          generate_badge('assets/manners.png', 20, 35, 55, 'star')
          generate_badge('assets/fruit.png', 25, 45, 30, 'money')
          generate_badge('assets/plant.png', 15, 40, 25, 'plant')
          generate_badge('assets/matter.png', 20, 35, 50, 'planet')
          generate_badge('assets/physics.png', 15, 25, 50, 'planet')

          # 2. Modern 432Hz Kalimba & Marimba Soundtrack (Stereo Spatial)
          with wave.open('assets/soothing_lullaby.wav', 'w') as f:
              f.setnchannels(2); f.setsampwidth(2); f.setframerate(22050)
              melody = [392.00, 440.00, 523.25, 659.25, 783.99, 659.25, 523.25, 440.00]
              sr = 22050
              frames = []
              for idx, note in enumerate(melody):
                  for i in range(int(sr * 0.65)):
                      t = i / sr
                      env = math.exp(-i / (sr * 0.28))
                      pan = 0.5 + 0.35 * math.sin(idx)
                      sig = (math.sin(2 * math.pi * note * t) + 0.35 * math.sin(4 * math.pi * note * t)) * env * 4800
                      frames.append(struct.pack('<hh', int(sig * pan), int(sig * (1.0 - pan))))
              f.writeframes(b''.join(frames))

          # 3. Sparkling Stereo Celebration Chimes
          with wave.open('assets/celebrate.wav', 'w') as f:
              f.setnchannels(2); f.setsampwidth(2); f.setframerate(22050)
              fanfare = [523.25, 659.25, 783.99, 1046.50]
              sr = 22050
              frames = []
              for note in fanfare:
                  for i in range(int(sr * 0.32)):
                      t = i / sr
                      env = math.exp(-i / (sr * 0.10))
                      sig = (math.sin(2 * math.pi * note * t) + 0.4 * math.sin(4 * math.pi * note * t)) * env * 6000
                      frames.append(struct.pack('<hh', int(sig * 0.8), int(sig * 1.0)))
              f.writeframes(b''.join(frames))
          "

      - name: Build Android Debug APK
        run: |
          buildozer -v android debug

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: bin/*.apk
          
