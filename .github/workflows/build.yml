name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Game Assets
        run: |
          mkdir -p assets
          # Generate placeholder audio and video without external tool failures
          python3 -c "
          import wave, struct, os
          with wave.open('assets/soothing_lullaby.wav', 'w') as f:
              f.setnchannels(1); f.setsampwidth(2); f.setframerate(22050)
              for i in range(22050 * 5):
                  f.writeframesraw(struct.pack('<h', int(3000 * (i % 50 > 25))))
          with wave.open('assets/celebrate.wav', 'w') as f:
              f.setnchannels(1); f.setsampwidth(2); f.setframerate(22050)
              for i in range(22050 * 2):
                  f.writeframesraw(struct.pack('<h', int(6000 * (i % 25 > 12))))
          "

      - name: Build Android Debug APK
        run: |
          buildozer -v android debug

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: bin/*.apk
