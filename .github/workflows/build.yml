name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev ffmpeg

      - name: Generate Built-in Audio & Video Assets
        run: |
          mkdir -p assets
          ffmpeg -f lavfi -i "sine=frequency=432:duration=10" -q:a 9 -acodec libmp3lame assets/soothing_lullaby.mp3 -y
          ffmpeg -f lavfi -i "sine=frequency=880:duration=2" -q:a 9 -acodec libmp3lame assets/celebrate.mp3 -y
          ffmpeg -f lavfi -i "testsrc=duration=10:size=720x1280:rate=30" -pix_fmt yuv420p assets/safari_video.mp4 -y

      - name: Install Python build tools
        run: |
          pip install --upgrade pip
          pip install "Cython==0.29.36" buildozer virtualenv

      - name: Build Android APK
        run: |
          buildozer -v android debug

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: bin/*.apk
          
