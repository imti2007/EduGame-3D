name: Build NovaQuest 3D APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Synthesize Game Assets & Audio
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p assets
          python3 -c "
          import wave, struct, math, zlib

          # 1. Pure Python 256x256 Vector PNG Generator
          def generate_png(path, r_val, g_val, b_val):
              w, h = 256, 256
              raw = bytearray()
              for y in range(h):
                  raw.append(0)
                  for x in range(w):
                      dx, dy = x - 128, y - 128
                      dist = math.sqrt(dx*dx + dy*dy)
                      if dist < 80:
                          raw.extend([r_val, g_val, b_val])
                      elif abs(dist - 90) < 4:
                          raw.extend([0, 229, 255])
                      else:
                          raw.extend([15, 25, 45])

              ihdr = struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)
              idat = zlib.compress(bytes(raw), 9)
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)

              with open(path, 'wb') as f:
                  f.write(b'\x89PNG\r\n\x1a\n')
                  f.write(chunk(b'IHDR', ihdr))
                  f.write(chunk(b'IDAT', idat))
                  f.write(chunk(b'IEND', b''))

          generate_png('assets/money.png', 255, 200, 30)
          generate_png('assets/planets.png', 70, 180, 255)
          generate_png('assets/sun.png', 255, 215, 0)
          generate_png('assets/manners.png', 255, 140, 40)
          generate_png('assets/fruit.png', 235, 85, 35)
          generate_png('assets/plant.png', 50, 210, 85)
          generate_png('assets/matter.png', 110, 195, 255)
          generate_png('assets/physics.png', 150, 105, 255)

          # 2. Kalimba Ambient Soundtrack (WAV PCM 16-bit Mono)
          with wave.open('assets/soothing_lullaby.wav', 'w') as f:
              f.setnchannels(1); f.setsampwidth(2); f.setframerate(22050)
              melody = [392.00, 440.00, 523.25, 659.25, 523.25]
              sr = 22050
              frames = []
              for note in melody:
                  for i in range(int(sr * 0.5)):
                      t = i / sr
                      env = math.exp(-i / (sr * 0.25))
                      sig = math.sin(2 * math.pi * note * t) * env * 4500
                      frames.append(struct.pack('<h', int(sig)))
              f.writeframes(b''.join(frames))

          # 3. Soft Celebration Fanfare
          with wave.open('assets/celebrate.wav', 'w') as f:
              f.setnchannels(1); f.setsampwidth(2); f.setframerate(22050)
              fanfare = [523.25, 659.25, 783.99, 1046.50]
              sr = 22050
              frames = []
              for note in fanfare:
                  for i in range(int(sr * 0.25)):
                      t = i / sr
                      env = math.exp(-i / (sr * 0.10))
                      sig = math.sin(2 * math.pi * note * t) * env * 5500
                      frames.append(struct.pack('<h', int(sig)))
              f.writeframes(b''.join(frames))
          "

      - name: Build Android APK
        run: |
          buildozer -v android debug

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: bin/*.apk
          
