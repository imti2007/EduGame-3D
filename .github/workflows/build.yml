name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Audio & Video Assets
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          mkdir -p assets
          ffmpeg -f lavfi -i "sine=frequency=432:duration=10" -q:a 9 -acodec libmp3lame assets/soothing_lullaby.mp3 -y
          ffmpeg -f lavfi -i "sine=frequency=880:duration=2" -q:a 9 -acodec libmp3lame assets/celebrate.mp3 -y
          ffmpeg -f lavfi -i "testsrc=duration=10:size=720x1280:rate=30" -pix_fmt yuv420p assets/safari_video.mp4 -y

      - name: Build with Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          buildozer_version: stable
          command: buildozer android debug

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: bin/*.apk
          
