name: Build WildPals AI APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Icon, Animal Images, and Audio Assets
        run: |
          mkdir -p assets
          python3 -c "
          import wave, struct, math, zlib

          # Helper to write PNGs using standard library
          def make_animal_png(filename, primary_rgb, ear_rgb, detail_type):
              w, h = 320, 240
              raw = bytearray()
              for y in range(h):
                  raw.append(0)
                  for x in range(w):
                      dx = x - 160
                      dy = y - 120
                      dist = math.sqrt(dx*dx + dy*dy)

                      # Background card
                      r, g, b = 24, 38, 48
                      
                      # Animal head circle
                      if dist < 70:
                          r, g, b = primary_rgb
                      
                      # Ears
                      if (math.sqrt((x-110)**2 + (y-65)**2) < 26) or (math.sqrt((x-210)**2 + (y-65)**2) < 26):
                          r, g, b = ear_rgb
                      
                      # Eyes
                      if (math.sqrt((x-135)**2 + (y-110)**2) < 7) or (math.sqrt((x-185)**2 + (y-110)**2) < 7):
                          r, g, b = 20, 20, 20
                      
                      # Cheerful smile
                      if 140 < x < 180 and 130 < y < 146 and (y - 130) > abs(x - 160) * 0.4:
                          r, g, b = 30, 30, 30
                      
                      # Extra features (e.g. elephant trunk, tiger stripes)
                      if detail_type == 'trunk' and 150 < x < 170 and 125 < y < 175:
                          r, g, b = primary_rgb
                      elif detail_type == 'stripes' and dist < 68 and (x % 24 < 6):
                          r, g, b = 40, 20, 10

                      raw.extend([r, g, b])

              ihdr = struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)
              idat = zlib.compress(bytes(raw), 9)
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)

              with open(filename, 'wb') as f:
                  f.write(b'\x89PNG\r\n\x1a\n')
                  f.write(chunk(b'IHDR', ihdr))
                  f.write(chunk(b'IDAT', idat))
                  f.write(chunk(b'IEND', b''))

          # Generate Animal Images
          make_animal_png('assets/tiger.png', (255, 140, 0), (220, 80, 0), 'stripes')
          make_animal_png('assets/elephant.png', (140, 155, 170), (120, 135, 150), 'trunk')
          make_animal_png('assets/giraffe.png', (250, 195, 45), (200, 140, 20), 'none')
          make_animal_png('assets/zebra.png', (230, 230, 230), (70, 70, 70), 'stripes')
          make_animal_png('assets/cheetah.png', (245, 180, 35), (190, 120, 10), 'none')
          make_animal_png('assets/kangaroo.png', (185, 122, 60), (150, 95, 40), 'none')
          make_animal_png('assets/snow_leopard.png', (215, 220, 230), (160, 170, 185), 'none')

          # 1. High-Res App Icon
          make_animal_png('assets/icon.png', (255, 179, 0), (230, 81, 0), 'stripes')

          # 2. Gentle Soothing Lullaby
          with wave.open('assets/soothing_lullaby.wav', 'w') as f:
              f.setnchannels(1); f.setsampwidth(2); f.setframerate(22050)
              notes = [261.63, 329.63, 392.00, 440.00, 523.25, 392.00]
              sr = 22050
              frames = []
              for note in notes:
                  for i in range(int(sr * 1.0)):
                      t = i / sr
                      env = math.sin(math.pi * (i / (sr * 1.0)))
                      val = (math.sin(2 * math.pi * note * t) * 0.75 + math.sin(4 * math.pi * note * t) * 0.25) * env * 3500
                      frames.append(struct.pack('<h', int(val)))
              f.writeframes(b''.join(frames))

          # 3. Soft Celebration Chimes
          with wave.open('assets/celebrate.wav', 'w') as f:
              f.setnchannels(1); f.setsampwidth(2); f.setframerate(22050)
              chime_notes = [523.25, 659.25, 783.99, 1046.50]
              sr = 22050
              frames = []
              for note in chime_notes:
                  for i in range(int(sr * 0.35)):
                      t = i / sr
                      env = math.exp(-i / (sr * 0.12))
                      val = (math.sin(2 * math.pi * note * t) + 0.3 * math.sin(4 * math.pi * note * t)) * env * 5500
                      frames.append(struct.pack('<h', int(val)))
              f.writeframes(b''.join(frames))
          "

      - name: Build Android Debug APK
        run: |
          buildozer -v android debug

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: bin/*.apk
          
