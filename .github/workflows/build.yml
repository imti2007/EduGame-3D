name: Build WildPals AI APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Icon, Audio, and Video Assets
        run: |
          mkdir -p assets
          python3 -c "
          import wave, struct, math
          from PIL import Image, ImageDraw

          # 1. Generate 512x512 High-Res App Icon
          img = Image.new('RGBA', (512, 512), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)
          for y in range(512):
              r = int(255 - (y / 512) * 190)
              g = int(165 - (y / 512) * 50)
              b = int(0 + (y / 512) * 70)
              draw.line([(0, y), (512, y)], fill=(r, g, b, 255))
          draw.ellipse([80, 80, 432, 432], fill=(255, 248, 225, 255))
          draw.ellipse([110, 110, 402, 402], fill=(255, 179, 0, 255))
          draw.ellipse([100, 100, 180, 180], fill=(230, 81, 0, 255))
          draw.ellipse([332, 100, 412, 180], fill=(230, 81, 0, 255))
          draw.ellipse([190, 230, 225, 265], fill=(33, 33, 33, 255))
          draw.ellipse([287, 230, 322, 265], fill=(33, 33, 33, 255))
          draw.arc([220, 270, 292, 330], start=0, end=180, fill=(33, 33, 33, 255), width=8)
          img.save('assets/icon.png', 'PNG')

          # 2. Generate Gentle Pentatonic Lullaby (No harsh beep)
          with wave.open('assets/soothing_lullaby.wav', 'w') as f:
              f.setnchannels(1); f.setsampwidth(2); f.setframerate(22050)
              notes = [261.63, 329.63, 392.00, 440.00, 523.25, 392.00]
              sr = 22050
              frames = []
              for note in notes:
                  for i in range(int(sr * 1.0)):
                      t = i / sr
                      env = math.sin(math.pi * (i / (sr * 1.0)))
                      val = (math.sin(2 * math.pi * note * t) * 0.75 + math.sin(4 * math.pi * note * t) * 0.25) * env * 3500
                      frames.append(struct.pack('<h', int(val)))
              f.writeframes(b''.join(frames))

          # 3. Generate Gentle Celebration Chimes
          with wave.open('assets/celebrate.wav', 'w') as f:
              f.setnchannels(1); f.setsampwidth(2); f.setframerate(22050)
              chime_notes = [523.25, 659.25, 783.99, 1046.50]
              sr = 22050
              frames = []
              for note in chime_notes:
                  for i in range(int(sr * 0.35)):
                      t = i / sr
                      env = math.exp(-i / (sr * 0.12))
                      val = (math.sin(2 * math.pi * note * t) + 0.3 * math.sin(4 * math.pi * note * t)) * env * 5500
                      frames.append(struct.pack('<h', int(val)))
              f.writeframes(b''.join(frames))
          "

      - name: Build Android Debug APK
        run: |
          buildozer -v android debug

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: bin/*.apk
          
