name: Build WildPals AI APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Icon, Audio, and Video Assets
        run: |
          mkdir -p assets
          python3 -c "
          import wave, struct, math, zlib

          # 1. Pure Python 512x512 High-Res PNG Generator (Zero External Dependencies)
          def create_app_icon():
              width, height = 512, 512
              raw_data = bytearray()
              for y in range(height):
                  raw_data.append(0)  # PNG filter type None
                  for x in range(width):
                      # Calculate radial gradient and cute circular emblem
                      dx = x - 256
                      dy = y - 256
                      dist = math.sqrt(dx*dx + dy*dy)
                      
                      # Background Savanna Amber-to-Green
                      r = int(255 - (y / 512) * 190)
                      g = int(165 - (y / 512) * 50)
                      b = int(0 + (y / 512) * 70)
                      
                      # Inner Golden Shield
                      if dist < 170:
                          r, g, b = 255, 179, 0
                      # Lion Ears
                      if (math.sqrt((x-140)**2 + (y-140)**2) < 45) or (math.sqrt((x-372)**2 + (y-140)**2) < 45):
                          r, g, b = 230, 81, 0
                      # Eyes
                      if (math.sqrt((x-200)**2 + (y-230)**2) < 14) or (math.sqrt((x-312)**2 + (y-230)**2) < 14):
                          r, g, b = 30, 30, 30
                      # Cheerful Smile
                      if 210 < x < 302 and 270 < y < 290 and (y - 270) > abs(x - 256) * 0.35:
                          r, g, b = 40, 40, 40

                      raw_data.extend([r, g, b])

              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)

              ihdr = struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0)
              idat = zlib.compress(bytes(raw_data), 9)
              
              with open('assets/icon.png', 'wb') as f:
                  f.write(b'\x89PNG\r\n\x1a\n')
                  f.write(chunk(b'IHDR', ihdr))
                  f.write(chunk(b'IDAT', idat))
                  f.write(chunk(b'IEND', b''))

          create_app_icon()

          # 2. Gentle Soothing Lullaby
          with wave.open('assets/soothing_lullaby.wav', 'w') as f:
              f.setnchannels(1); f.setsampwidth(2); f.setframerate(22050)
              notes = [261.63, 329.63, 392.00, 440.00, 523.25, 392.00]
              sr = 22050
              frames = []
              for note in notes:
                  for i in range(int(sr * 1.0)):
                      t = i / sr
                      env = math.sin(math.pi * (i / (sr * 1.0)))
                      val = (math.sin(2 * math.pi * note * t) * 0.75 + math.sin(4 * math.pi * note * t) * 0.25) * env * 3500
                      frames.append(struct.pack('<h', int(val)))
              f.writeframes(b''.join(frames))

          # 3. Gentle Celebration Chimes
          with wave.open('assets/celebrate.wav', 'w') as f:
              f.setnchannels(1); f.setsampwidth(2); f.setframerate(22050)
              chime_notes = [523.25, 659.25, 783.99, 1046.50]
              sr = 22050
              frames = []
              for note in chime_notes:
                  for i in range(int(sr * 0.35)):
                      t = i / sr
                      env = math.exp(-i / (sr * 0.12))
                      val = (math.sin(2 * math.pi * note * t) + 0.3 * math.sin(4 * math.pi * note * t)) * env * 5500
                      frames.append(struct.pack('<h', int(val)))
              f.writeframes(b''.join(frames))
          "

      - name: Build Android Debug APK
        run: |
          buildozer -v android debug

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: bin/*.apk
          
